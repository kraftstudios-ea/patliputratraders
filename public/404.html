<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <script>
    // Instant smart recovery: route old or misspelled product links directly to classic shop modal
    (function () {
      var p = window.location.pathname;
      var prodMatch = p.match(/^\/p\/(\d+)(?:-[^\/]*)?\/?$/);
      if (prodMatch) {
        window.location.replace('/shop/?product=' + prodMatch[1]);
        return;
      }
      var sp = new URLSearchParams(window.location.search);
      var id = sp.get('product') || sp.get('id');
      if (id && /^\d+$/.test(id)) {
        window.location.replace('/shop/?product=' + encodeURIComponent(id));
        return;
      }
      var f1Match = p.match(/^\/(?:shop\/)?f1(?:\/|-posters\/?.*)?$/i);
      if (f1Match) {
        window.location.replace('/shop/?type=Posters&category=F1');
        return;
      }
    })();
  </script>
  <script src="/api-base.js?v=3"></script>
