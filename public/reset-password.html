<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="api-base.js?v=2"></script>
  <script src="theme.js?v=2"></script>
  <title>Reset Password — Patliputra Traders</title>
  <link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/site/patliputra-logo.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <meta name="description" content="Reset your Patliputra Traders account password.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <script src="https://kit.fontawesome.com/84df58c29a.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="styles.css?v=38">
  <script src="lenis.min.js"></script>
  <script src="scroll.js" defer></script>
  <style>
    .reset-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px;
    }

    .reset-card {
      max-width: 420px;
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      text-align: center;
    }

    .reset-card h1 {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .reset-card .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .reset-card form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reset-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.8rem;
      color: white;
    }

    .reset-icon.success { background: linear-gradient(135deg, var(--success), color-mix(in srgb, var(--success) 70%, black)); }
    .reset-icon.error { background: linear-gradient(135deg, var(--sale-red), color-mix(in srgb, var(--sale-red) 70%, black)); }

    .loading-state { text-align: center; padding: 20px 0; }
    .loading-state .loader {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="global-navbar.js?v=21" defer></script>
  <script src="analytics.js" defer></script>
  <script src="interactions.js?v=1" defer></script>
</head>

<body>

  <global-navbar></global-navbar>

  <main id="main-content" class="reset-page">
    <div class="reset-card" id="reset-card">
      <div class="loading-state">
        <div class="loader"></div>
        <p style="color:var(--text-secondary);">Loading...</p>
      </div>
    </div>
  </main>

  <script>

    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('reset-card');
      const params = new URLSearchParams(window.location.search);
      const token = (params.get('token') || '').trim();

      if (!token) {
        card.innerHTML = `
          <div class="reset-icon error"><i class="fa-solid fa-circle-exclamation"></i></div>
          <h1>Invalid Link</h1>
          <p class="subtitle">This reset link is missing its token. Request a new one from the login page.</p>
          <a href="/?login=1" class="hero-cta">Go to Log In →</a>
        `;
        return;
      }

      card.innerHTML = `
        <h1>Set a New Password</h1>
        <p class="subtitle">Choose a new password for your Brush account.</p>
        <form id="reset-password-form">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" autocomplete="new-password" required minlength="8">
          </div>
          <button type="submit" class="auth-submit-btn">Update Password</button>
          <div class="auth-error" id="reset-page-error"></div>
        </form>
      `;

      document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const err = document.getElementById('reset-page-error');
        const btn = e.target.querySelector('button');

        btn.textContent = 'Updating...';
        btn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to reset password');

          card.innerHTML = `
            <div class="reset-icon success"><i class="fa-solid fa-check"></i></div>
            <h1>Password Updated</h1>
            <p class="subtitle">Your password has been changed. You can now log in with your new password.</p>
            <a href="/?login=1" class="hero-cta">Log In →</a>
          `;
        } catch (error) {
          err.textContent = error.message;
          btn.textContent = 'Update Password';
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
